<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DRF API Notes</title>
</head>
<body>
    <h1>DRF API Notes</h1>
    
    <h3>Создать заметку (POST)</h3>
    <input type="text" id="title" placeholder="Заголовок"><br>
    <textarea id="content" placeholder="Текст"></textarea><br>
    <button onclick="createArticle()">Создать</button>
    
    <h3>Список заметок (GET)</h3>
    <button onclick="loadArticles()">Обновить</button>
    <div id="articles"></div>

    <script>
        const API_URL = 'http://192.168.170.40:8001/api/articles/';
        const CSRF_URL = 'http://192.168.170.40:8001/api/get-csrf-token/';
        
        let csrfToken = '';

        async function getCsrfToken() {
            try {
                const response = await fetch(CSRF_URL);
                const data = await response.json();
                csrfToken = data.csrfToken;
                console.log('CSRF Token получен:', csrfToken);
            } catch (error) {
                console.error('Ошибка получения CSRF токена:', error);
            }
        }

        async function loadArticles() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const container = document.getElementById('articles');
                
                if (data.length === 0) {
                    container.innerHTML = 'Пусто. Создайте первую заметку!';
                    return;
                }

                container.innerHTML = data.map(a => 
                    `<div><b>${a.title}</b><br>${a.content}<br><small>${a.created_at || ''}</small><hr></div>`
                ).join('');
            } catch (error) {
                console.error(error);
                document.getElementById('articles').innerHTML = 'Ошибка загрузки.';
            }
        }

        async function createArticle() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!title || !content) {
                alert('Заполните заголовок и текст');
                return;
            }

            if (!csrfToken) {
                await getCsrfToken();
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                    loadArticles();
                } else {
                    const errText = await response.text();
                    alert('Ошибка ' + response.status + ': ' + errText);
                }
            } catch (error) {
                console.error(error);
                alert('Ошибка сети. Проверьте, запущен ли сервер.');
            }
        }

        window.onload = async () => {
            await getCsrfToken();
            loadArticles();
        };
    </script>
</body>
</html>
